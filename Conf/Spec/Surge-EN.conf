# 优化版配置 - 基于您的需求整合
# 日期：2025-08-07
# 版本：4.0.0
# 适用版本：iOS/macOS的Surge 5

[General]
# === 网络优化 ===
# 增强Wi-Fi辅助
wifi-assist = true
# 混合网络（建议关闭避免连接问题）
all-hybrid = false
# UDP优先级（关闭以提高稳定性）
udp-priority = false
# IPv6支持
ipv6 = false
ipv6-vif = auto

# === 连接测试 ===
internet-test-url = http://wifi.vivo.com.cn/generate_204
proxy-test-url = http://cp.cloudflare.com/generate_204
test-timeout = 5

# === GeoIP数据库 ===
geoip-maxmind-url = https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb

# === Wi-Fi访问控制 ===
allow-wifi-access = false
wifi-access-http-port = 6152
wifi-access-socks5-port = 6153
allow-hotspot-access = false

# === 远程控制器 ===
http-api-web-dashboard = true
use-default-policy-if-wifi-not-primary = false

# === DNS设置 ===
dns-server = 223.5.5.5, 119.29.29.29, 8.8.8.8, system
encrypted-dns-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query
hijack-dns = 8.8.8.8:53, 8.8.4.4:53
read-etc-hosts = true
use-local-host-item-for-proxy = true

# === 跳过代理 ===
skip-proxy = localhost, *.local, captive.apple.com, guzzoni.apple.com, 0.0.0.0/8, 10.0.0.0/8, 17.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 192.88.99.0/24, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4, 255.255.255.255/32
exclude-simple-hostnames = true

# === Always Real IP ===
always-real-ip = *.srv.nintendo.net, *.stun.playstation.net, xbox.*.microsoft.com, *.xboxlive.com, *.battlenet.com.cn, *.battlenet.com, *.blzstatic.cn, *.battle.net, link-ip.nextdns.io, *.msftconnecttest.com, *.msftncsi.com, *.logon.battlenet.com.cn, *.logon.battle.net, stun.l.google.com

# === 其他设置 ===
loglevel = notify
show-error-page-for-reject = true
udp-policy-not-supported-behaviour = REJECT
force-http-engine-hosts = *.ott.cibntv.net, 123.59.31.1, 119.18.193.135, 122.14.246.33, 175.102.178.52

[Proxy]
LosSantos = snell, 107.174.253.218, 8443, psk=p1r7tSdU4J7vr7eMbgbX, version=4, shadow-tls-password=p1r7tSdU4J7vr7eMbgbX, shadow-tls-sni=mp.weixin.qq.com, shadow-tls-version=3

